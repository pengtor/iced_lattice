[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Lattice spreadsheet: iced desktop front-end"

[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "lattice"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
iced.workspace = true
# For the settings file only. Workbooks go through `engine::io`, but a preference
# about your own screen is not a document and does not belong in that format.
serde.workspace = true
serde_json.workspace = true
