[workspace]
resolver = "2"
members = ["engine", "lattice-grid", "examples/spreadsheet"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# The default floor for workspace members, chosen to match an unpinned
# `cargo update`. `iced` 0.14 itself requires 1.88; its `wgpu` backend pulls
# `ordered-float` 5.5, which requires 1.90. Only that last one is not structural:
# `ordered-float` 5.4.0 declares 1.63 and `wgpu-hal` accepts ">=3, <6.0", so
# pinning it back lets the whole workspace build on 1.88 (verified). We do not
# pin, deliberately — see CONTRIBUTING.md, "Minimum supported Rust version".
# The `engine` crate has no UI dependencies and declares its own lower floor.
rust-version = "1.90"
license = "MIT"
description = "Lattice — a spreadsheet with a real recalculation engine"

[workspace.dependencies]
# engine
logos = "0.16"
chumsky = "0.13"
petgraph = "0.8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# app
# `wgpu` is the GPU renderer; `tiny-skia` (the CPU fallback) is left out because its
# `softbuffer` dependency does not currently compile on this toolchain.
#
# `linux-theme-detection` is opt-in but is part of iced's own default set, so
# turning off defaults silently drops it. Without it Linux has no way to hear the
# desktop's light/dark setting change: winit's `ThemeChanged` is emitted only on
# macOS, Windows and the web, and its X11 backend answers `None` when asked
# outright. See `examples/spreadsheet/src/input.rs`, the `iced::system::theme_changes()`
# subscription.
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "canvas",
    "tokio",
    "x11",
    "wayland",
    "crisp",
    "advanced",
    "linux-theme-detection",
] }

# lattice-grid
# The widget is meant to be embedded in someone else's iced application, so it
# depends on the two crates it actually draws with and not the `iced` facade.
# The facade would add winit, the application runtime, the tokio executor and
# the platform backends — none of which a canvas widget touches. The host
# application already depends on `iced` and turns all of that on, and because
# Cargo unifies features for the crates built together, `iced_renderer` ends up
# with a real backend either way.
#
# `canvas` is the feature that matters: it is what makes `iced_widget::canvas`
# (and the `iced_renderer/geometry` feature underneath it) exist at all.
#
# One consequence: `cargo build -p lattice-grid --release` on its own fails
# inside `iced_renderer`, which refuses to compile in release without a renderer
# backend. That is not a missing type here — it is the same reason `iced` is
# assembled from a widget half and a renderer half. A debug build (and
# `cargo test -p lattice-grid`) picks up `iced_graphics`'s no-op `Renderer` for
# `()`, and any build that includes the application — `cargo build --workspace`,
# `run.sh`, `cargo package` — gets `wgpu` from the `iced` dependency above.
# Enabling `iced_widget/wgpu` here would fix the standalone release build and
# cost 37 crates (76 -> 113, adding `iced_wgpu` and the `wgpu` stack) for a
# binary this crate does not contain.
iced_core = { version = "0.14", default-features = false }

iced_widget = { version = "0.14", default-features = false, features = [
    "canvas",
] }

# dev
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
